<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img"
     aria-label="A segment maps to a query via create_query, and the query maps back to the same segment via retrieve.">
  <defs>
    <marker id="ssr-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ba4b0"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <!-- nodes -->
    <rect x="28" y="53" width="128" height="44" rx="9" fill="#282727" stroke="#625e5a"/>
    <text x="92" y="75" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#dcd7ba">segment</text>
    <rect x="264" y="53" width="128" height="44" rx="9" fill="#282727" stroke="#625e5a"/>
    <text x="328" y="75" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#dcd7ba">query</text>

    <!-- create_query: segment -> query -->
    <path d="M156,66 C 195,48 225,48 264,66" fill="none" stroke="#8ba4b0" stroke-width="2" marker-end="url(#ssr-arrow)"/>
    <text x="210" y="40" text-anchor="middle" font-size="15" fill="#c4b28a">create_query</text>

    <!-- retrieve: query -> segment -->
    <path d="M264,84 C 225,102 195,102 156,84" fill="none" stroke="#8ba4b0" stroke-width="2" marker-end="url(#ssr-arrow)"/>
    <text x="210" y="120" text-anchor="middle" font-size="15" fill="#c4b28a">retrieve</text>
  </g>
</svg>
